# Entorno de desarrollo local de Semtex: Postgres + MinIO (storage) + Ollama (IA).
# La app se ejecuta aparte con `mvn spring-boot:run` (ver README).
#
#   docker compose -f docker-compose.dev.yml up -d
#
# La primera vez, el servicio ollama-pull descarga llama3.1:8b (~5 GB).

name: semtex-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: semtex-pg
    environment:
      POSTGRES_DB: semtex
      POSTGRES_USER: semtex
      POSTGRES_PASSWORD: semtex
    ports:
      # Si ya tienes un Postgres nativo ocupando el 5432, cambia el lado izquierdo a 5433
      # y ajusta spring.datasource.url en application.properties a localhost:5433.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semtex"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: semtex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - miniodata:/data

  # Crea el bucket que usa FileStoragePort y termina.
  createbucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'esperando minio...'; sleep 1; done;
      mc mb --ignore-existing local/semtex-documents;
      echo 'bucket semtex-documents listo';
      "
    restart: "no"

  ollama:
    image: ollama/ollama
    container_name: semtex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Descarga el modelo una vez y termina.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      /bin/sh -c "
      until ollama list >/dev/null 2>&1; do echo 'esperando ollama...'; sleep 2; done;
      ollama pull llama3.1:8b;
      echo 'modelo llama3.1:8b listo';
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
  ollama:
